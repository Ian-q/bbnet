[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbnet"
version = "0.1.0"
description = "A netlist, DRC, autorouter, and printable build-sheet engine for hand-built breadboards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "PyYAML",
]

[project.urls]
Repository = "https://github.com/Ian-q/bbnet"

[project.scripts]
bbnet = "bbnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin to ruff's historical default rule set so CI stays deterministic even
# as ruff (installed unpinned in ci.yml) changes its defaults, and because
# this is the rule set the engine was actually written and reviewed
# against in its original repo.
#   E4 import errors · E7 statement style · E9 syntax · F pyflakes
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# test_model.py's derivation-test section imports namedtuple after a
# section-comment banner, well past the top of the file.
"tests/test_model.py" = ["E402"]
